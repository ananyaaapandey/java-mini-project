services:
  db:
    image: postgres:16-alpine
    container_name: evege-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: evege
      POSTGRES_USER: evege_user
      POSTGRES_PASSWORD: evege_password
    ports:
      - "5432:5432"
    volumes:
      - evege-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evege_user -d evege"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: evege-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: evege
      PGUSER: evege_user
      PGPASSWORD: evege_password
    ports:
      - "8080:8080"

volumes:
  evege-data:
